<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · {{TITLE}}</title>
<style>
  :root {
    --accent: {{ACCENT}};
    --bg: #f5f6f8;
    --bg-glow: color-mix(in srgb, var(--accent) 12%, transparent);
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --input-bg: #ffffff;
    --error-bg: #fef2f2;
    --error-text: #b91c1c;
    --error-border: #fecaca;
    --notice-bg: #f0fdf4;
    --notice-text: #15803d;
    --notice-border: #bbf7d0;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -8px rgba(16, 24, 40, .12);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --bg-glow: color-mix(in srgb, var(--accent) 18%, transparent);
      --card: #151821;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #262a35;
      --input-bg: #0f1218;
      --error-bg: rgba(239, 68, 68, .1);
      --error-text: #fca5a5;
      --error-border: rgba(239, 68, 68, .3);
      --notice-bg: rgba(34, 197, 94, .1);
      --notice-text: #86efac;
      --notice-border: rgba(34, 197, 94, .3);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -12px rgba(0, 0, 0, .6);
    }
    .mark { color: color-mix(in srgb, var(--accent) 65%, white) !important; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background:
      radial-gradient(60rem 30rem at 50% -10%, var(--bg-glow), transparent 70%),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px 32px;
    box-shadow: var(--shadow);
  }
  .mark {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .msg { border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 18px; border: 1px solid; }
  .msg-error { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
  .msg-notice { background: var(--notice-bg); color: var(--notice-text); border-color: var(--notice-border); }
  label { display: block; font-size: 13px; font-weight: 550; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input[type=text], input[type=password] {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    font: inherit;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  button {
    width: 100%;
    height: 42px;
    margin-top: 8px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: filter .15s, box-shadow .15s;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 18px; }
  @media (max-width: 420px) { .card { padding: 28px 22px 24px; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
      </svg>
    </div>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{SUBTITLE}}</p>
    {{MESSAGE}}
    <form method="post" action="/_gate/login">
      <input type="hidden" name="next" value="{{NEXT}}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{USERNAME}}" autocomplete="username" autocapitalize="none" spellcheck="false" required {{USER_AUTOFOCUS}}>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required {{PASS_AUTOFOCUS}}>
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <p class="foot">Access is restricted to authorized users.</p>
</main>
</body>
</html>
